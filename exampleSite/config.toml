baseURL = "https://example.org/"
title = "Example Person"
theme = "2026-personal-brand-theme"
enableRobotsTXT = true

[pagination]
  pagerSize = 6

[Params]
  description = "Explore small web projects, practical notes on accessibility, and lessons from building in public. A demo of the 2026 Personal Brand Hugo theme."

[Params.author]
  name = "Example Person"
  location = "Somewhere"
  image = "images/portrait.svg"
  image_alt = "Illustrated placeholder portrait"
  bio = "A short biography about the person behind this site."

[Params.brand]
  name = "Example Person"
  mark = "."
  connect_url = "contact/"
  connect_text = "Start a conversation"
  about_url = "about/"
  github_url = "https://github.com/example"
  footer_tagline = "Always learning and sharing."

[Params.home]
  headline = ["Small tools.", "Useful notes."]
  headline_accent = "Shared openly."
  intro = ["Explore small web projects, practical notes on accessibility, and lessons from building in public.", "Start with a project, find an idea to try, or bring a question of your own."]
  about_text = "Meet the author"
  blog_text = "Find a practical guide"
  areas = ["Ideas", "Projects", "Community"]
  portrait_caption = "Usually found near a whiteboard"
  topics = ["Notes", "Hugo", "Accessibility"]
  cta_url = "contact/"
  cta_title = "Have a project or a talk in mind?"
  cta_text = "Share what you are working on, who it is for, and where you could use a hand."
  cta_link_text = "Start a conversation"

[[Params.home.highlights]]
  eyebrow = "01 / Build"
  title_lines = ["Ideas into", "working things."]
  description = "Side projects, small tools, and experiments that started with a question."
  url = "projects/"
  link_text = "Explore projects"

[[Params.home.highlights]]
  eyebrow = "02 / Share"
  title_lines = ["Talks, podcasts,", "and conversations."]
  description = "Conference sessions and podcast appearances about building on the web."
  url = "speaking/"
  link_text = "See speaking"

[[Params.home.highlights]]
  eyebrow = "03 / Write"
  title_lines = ["Notes from", "the journey."]
  description = "Longer thoughts on craft, accessibility, and learning in public."
  url = "blog/"
  link_text = "Read the blog"

[Params.search]
  enabled = true

[Params.copy_code]
  enabled = true

[Params.colors]
  appearance = "auto"

[Params.related]
  enabled = true
  limit = 3

# Related articles: shared tags decide relevance; the date only breaks near-ties.
[related]
  includeNewer = true
  threshold = 80
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10

[[Params.social]]
  name = "GitHub"
  url = "https://github.com/example"

[[Params.social]]
  name = "LinkedIn"
  url = "https://www.linkedin.com/in/example"

[outputFormats.Search]
  mediaType = "application/json"
  baseName = "search"
  isPlainText = true
  notAlternative = true

[[menu.main]]
  name = "About"
  identifier = "about"
  weight = 1
  url = "/about/"
[[menu.main]]
  name = "Blog"
  identifier = "blog"
  weight = 2
  url = "/blog/"
[[menu.main]]
  name = "Projects"
  identifier = "projects"
  weight = 3
  url = "/projects/"
[[menu.main]]
  name = "Speaking"
  identifier = "speaking"
  weight = 4
  url = "/speaking/"
