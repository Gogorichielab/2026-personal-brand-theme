baseURL = "https://example.org/"
title = "Example Person"
theme = "2026-personal-brand-theme"
enableRobotsTXT = true
defaultContentLanguage = "en"

[pagination]
  pagerSize = 6

# Declaring taxonomies replaces Hugo's defaults, so keep tags and categories.
[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[Params]
  description = "Explore small web projects, practical notes on accessibility, and lessons from building in public. A demo of the 2026 Personal Brand Hugo theme."

[Params.author]
  name = "Example Person"
  location = "Somewhere"
  image = "images/portrait.svg"
  image_alt = "Illustrated placeholder portrait"
  bio = "A short biography about the person behind this site."

[Params.brand]
  name = "Example Person"
  mark = "."
  connect_url = "contact/"
  connect_text = "Start a conversation"
  about_url = "about/"
  github_url = "https://github.com/example"
  footer_tagline = "Always learning and sharing."

[Params.home]
  headline = ["Small tools.", "Useful notes."]
  headline_accent = "Shared openly."
  intro = ["Explore small web projects, practical notes on accessibility, and lessons from building in public.", "Start with a project, find an idea to try, or bring a question of your own."]
  about_text = "Meet the author"
  blog_text = "Find a practical guide"
  areas = ["Ideas", "Projects", "Community"]
  portrait_caption = "Usually found near a whiteboard"
  topics = ["Notes", "Hugo", "Accessibility"]
  cta_url = "contact/"
  cta_title = "Have a project or a talk in mind?"
  cta_text = "Share what you are working on, who it is for, and where you could use a hand."
  cta_link_text = "Start a conversation"

[[Params.home.highlights]]
  eyebrow = "01 / Build"
  title_lines = ["Ideas into", "working things."]
  description = "Side projects, small tools, and experiments that started with a question."
  url = "projects/"
  link_text = "Explore projects"

[[Params.home.highlights]]
  eyebrow = "02 / Share"
  title_lines = ["Talks, podcasts,", "and conversations."]
  description = "Conference sessions and podcast appearances about building on the web."
  url = "speaking/"
  link_text = "See speaking"

[[Params.home.highlights]]
  eyebrow = "03 / Write"
  title_lines = ["Notes from", "the journey."]
  description = "Longer thoughts on craft, accessibility, and learning in public."
  url = "blog/"
  link_text = "Read the blog"

[Params.search]
  enabled = true

[Params.copy_code]
  enabled = true

[Params.colors]
  appearance = "auto"

[Params.share]
  enabled = true
  destinations = ["linkedin", "bluesky", "email"]

[Params.related]
  enabled = true
  limit = 3

# Related articles: shared tags decide relevance; the date only breaks near-ties.
[related]
  includeNewer = true
  threshold = 80
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10

[[Params.social]]
  name = "GitHub"
  url = "https://github.com/example"

[[Params.social]]
  name = "LinkedIn"
  url = "https://www.linkedin.com/in/example"

[outputFormats.Search]
  mediaType = "application/json"
  baseName = "search"
  isPlainText = true
  notAlternative = true

[[menu.main]]
  name = "About"
  identifier = "about"
  weight = 1
  url = "/about/"
[[menu.main]]
  name = "Blog"
  identifier = "blog"
  weight = 2
  url = "/blog/"
[[menu.main]]
  name = "Projects"
  identifier = "projects"
  weight = 3
  url = "/projects/"
[[menu.main]]
  name = "Speaking"
  identifier = "speaking"
  weight = 4
  url = "/speaking/"

# A second language shows the theme's translations and language switcher.
# Text from params and front matter is translated per language here.
[languages.en]
  weight = 1
  [languages.en.params]
    language_label = "English"

[languages.es]
  weight = 2
  [languages.es.params]
    language_label = "Español"
    description = "Pequeños proyectos web, notas prácticas sobre accesibilidad y lecciones de construir en público. Una demo del tema Hugo 2026 Personal Brand."
  [languages.es.params.author]
    bio = "Una breve biografía de la persona detrás de este sitio."
    location = "En algún lugar"
  [languages.es.params.brand]
    connect_text = "Iniciar una conversación"
    footer_tagline = "Siempre aprendiendo y compartiendo."
  [languages.es.params.home]
    headline = ["Pequeñas herramientas.", "Notas útiles."]
    headline_accent = "Compartidas."
    intro = ["Pequeños proyectos web, notas prácticas sobre accesibilidad y lecciones de construir en público.", "Empieza por un proyecto, encuentra una idea para probar o trae tu propia pregunta."]
    about_text = "Conoce al autor"
    blog_text = "Leer el blog"
    areas = ["Ideas", "Proyectos", "Comunidad"]
    portrait_caption = "Casi siempre cerca de una pizarra"
    cta_title = "¿Tienes un proyecto o una charla en mente?"
    cta_text = "Cuéntame en qué trabajas, para quién es y dónde te vendría bien ayuda."
    cta_link_text = "Iniciar una conversación"
    highlights = []

  [[languages.es.menus.main]]
    name = "Sobre mí"
    weight = 1
    url = "/es/about/"
  [[languages.es.menus.main]]
    name = "Blog"
    identifier = "blog"
    weight = 2
    url = "/es/blog/"
  [[languages.es.menus.main]]
    name = "Proyectos"
    weight = 3
    url = "/projects/"
  [[languages.es.menus.main]]
    name = "Charlas"
    weight = 4
    url = "/speaking/"
