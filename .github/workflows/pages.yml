name: Deploy demo site

on:
  push:
    branches:
      - main
  # Build (but don't deploy) PRs so template errors are caught before merging.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run per branch; let an in-progress deploy finish rather than cancel it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The demo builds with the newest supported Hugo; `compat` covers the older ones.
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.168.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo
        run: |
          curl -sSL -o "${{ runner.temp }}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf "${{ runner.temp }}/hugo.tar.gz" -C "${{ runner.temp }}" hugo
          echo "${{ runner.temp }}" >> "$GITHUB_PATH"

      # The repo checkout is the theme itself, so its parent directory is the themes dir.
      - name: Build exampleSite
        run: |
          hugo --source exampleSite --themesDir ../.. --gc --minify --panicOnWarning \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Test theme integration
        run: python3 -m unittest discover -s tests -v

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: exampleSite/public

  # Run the integration tests on theme.toml's min_version and the three Hugo
  # releases before the one `build` uses. Bump these with HUGO_VERSION.
  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hugo: ["0.146.0", "0.165.0", "0.166.0", "0.167.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Hugo ${{ matrix.hugo }}
        run: |
          curl -sSL -o "${{ runner.temp }}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${{ matrix.hugo }}/hugo_extended_${{ matrix.hugo }}_linux-amd64.tar.gz"
          tar -xzf "${{ runner.temp }}/hugo.tar.gz" -C "${{ runner.temp }}" hugo
          echo "${{ runner.temp }}" >> "$GITHUB_PATH"

      - name: Test theme integration
        run: python3 -m unittest discover -s tests -v

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
