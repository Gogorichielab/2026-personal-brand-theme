name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the changelog can be generated from all commits
          # since the previous release tag.
          fetch-depth: 0

      - name: Determine version and generate release notes
        id: changelog
        uses: TriPSs/conventional-changelog-action@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # main only accepts changes via PRs, so don't commit; just tag the
          # merge commit (versions come from v* tags) and publish notes on the release.
          skip-commit: true
          output-file: 'false'
          tag-prefix: v
          fallback-version: 0.1.0
          # Don't cut a release when the push contains no releasable commits
          # (e.g. docs-only or chore-only changes).
          skip-on-empty: true

      - name: Create GitHub release
        if: steps.changelog.outputs.skipped == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: ${{ steps.changelog.outputs.tag }}
          # Keep commit highlights, then append PR details, authors, and the comparison link.
          generate_release_notes: true
          body: |
            ## Highlights

            ${{ steps.changelog.outputs.clean_changelog }}
