version: 2
updates:
  # The only dependencies are the GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # One PR per month for all action updates.
    groups:
      github-actions:
        patterns: ["*"]
    # `ci:` keeps these updates from cutting a theme release.
    commit-message:
      prefix: ci
