{{ with .Paginator }}
	{{ if gt .TotalPages 1 }}
		<nav class="pagination" aria-label="{{ T "pagination_aria" }}">
			{{ if .HasPrev }}<a href="{{ .Prev.URL }}">← {{ T "newer_posts" }}</a>{{ end }}
			<span>{{ T "page_of" (dict "Number" .PageNumber "Total" .TotalPages) }}</span>
			{{ if .HasNext }}<a href="{{ .Next.URL }}">{{ T "older_posts" }} →</a>{{ end }}
		</nav>
	{{ end }}
{{ end }}
